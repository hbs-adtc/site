name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild hourly so new or edited Luma events appear within the hour.
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Password-protected opportunities page: skipped until both secrets are set.
      OPP_DEPLOY_KEY: ${{ secrets.OPP_DEPLOY_KEY }}
      DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Fetch opportunity dashboard
        if: env.OPP_DEPLOY_KEY != '' && env.DASHBOARD_PASSWORD != ''
        uses: actions/checkout@v4
        with:
          repository: hbs-adtc/opportunity-search
          ssh-key: ${{ secrets.OPP_DEPLOY_KEY }}
          path: _opp
          sparse-checkout: repository/dashboard.html
          sparse-checkout-cone-mode: false

      - name: Encrypt opportunity dashboard
        if: env.OPP_DEPLOY_KEY != '' && env.DASHBOARD_PASSWORD != ''
        run: node scripts/encrypt-dashboard.mjs _opp/repository/dashboard.html build/opportunities/index.html

      - name: Add SPA fallback
        run: |
          cp build/index.html build/404.html
          touch build/.nojekyll

      - name: Deploy production site
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: gh-pages
          clean: true
          clean-exclude: pr-preview
          force: false

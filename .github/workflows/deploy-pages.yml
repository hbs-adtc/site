name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild hourly so new or edited Luma events appear within the hour.
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Add SPA fallback
        run: |
          cp build/index.html build/404.html
          touch build/.nojekyll

      - name: Deploy production site
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: gh-pages
          clean: true
          clean-exclude: pr-preview
          force: false

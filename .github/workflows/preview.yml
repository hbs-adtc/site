name: Deploy PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency: preview-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      # Password-protected opportunities page: skipped until both secrets are set.
      OPP_DEPLOY_KEY: ${{ secrets.OPP_DEPLOY_KEY }}
      DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm install

      - name: Build preview
        if: github.event.action != 'closed'
        run: npm run build
        env:
          PUBLIC_URL: /site/pr-preview/pr-${{ github.event.number }}

      - name: Fetch opportunity dashboard
        if: env.OPP_DEPLOY_KEY != '' && env.DASHBOARD_PASSWORD != '' && github.event.action != 'closed'
        uses: actions/checkout@v4
        with:
          repository: hbs-adtc/opportunity-search
          ssh-key: ${{ secrets.OPP_DEPLOY_KEY }}
          path: _opp
          sparse-checkout: repository/dashboard.html
          sparse-checkout-cone-mode: false

      - name: Encrypt opportunity dashboard
        if: env.OPP_DEPLOY_KEY != '' && env.DASHBOARD_PASSWORD != '' && github.event.action != 'closed'
        run: node scripts/encrypt-dashboard.mjs _opp/repository/dashboard.html build/opportunities/index.html

      - name: Add SPA fallback
        if: github.event.action != 'closed'
        run: |
          cp build/index.html build/404.html
          touch build/.nojekyll

      - name: Deploy or remove preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./build
          preview-branch: gh-pages
          umbrella-dir: pr-preview
